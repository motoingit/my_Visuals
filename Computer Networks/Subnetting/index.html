<!--Filenames are case-sensitive on Pages. Index.html will 404.-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPv4 Subnetting Visualization</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    background: #111827;
    color: #f9fafb;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1100px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #60a5fa;
}

.subtitle {
    text-align: center;
    color: #9ca3af;
}

.controls {
    background: #1f2937;
    padding: 20px;
    border-radius: 12px;
    margin: 25px 0;
}

select {
    padding: 10px;
    border-radius: 6px;
    background: #374151;
    color: white;
    border: 1px solid #4b5563;
    font-size: 16px;
}

.visual {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 25px;
    margin: 35px 0;
}

.subnet {
    flex: 1;
    min-width: 250px;
    padding: 22px;
    border-radius: 12px;
    text-align: center;
    border: 2px solid;
}

.subnet-0 {
    border-color: #22c55e;
    background: #14532d33;
}

.subnet-1 {
    border-color: #c084fc;
    background: #581c8733;
}

.subnet h2 {
    margin-top: 0;
}

.subnet-0 h2 {
    color: #4ade80;
}

.subnet-1 h2 {
    color: #d8b4fe;
}

.network-id {
    font-size: 15px;
    color: #93c5fd;
    word-break: break-word;
}

.address {
    margin: 15px 0;
    font-size: 14px;
    line-height: 1.8;
    word-break: break-word;
}

.badge {
    display: inline-block;
    background: #374151;
    padding: 7px 12px;
    border-radius: 20px;
    margin: 4px;
    font-size: 13px;
}

.details {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(190px, 1fr));
    gap: 15px;
    margin-top: 30px;
}

.detail-card {
    background: #1f2937;
    padding: 18px;
    border-radius: 10px;
    border: 1px solid #374151;
}

.detail-card h3 {
    color: #60a5fa;
    font-size: 15px;
}

.detail-card p {
    font-size: 18px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.bit-section {
    margin-top: 30px;
    padding: 20px;
    background: #1f2937;
    border-radius: 12px;
}

.bits {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin: 15px 0;
}

.bit {
    width: 25px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 4px;
    font-size: 12px;
}

.network-bit {
    background: #2563eb;
}

.host-bit {
    background: #16a34a;
}

.legend {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 15px;
    font-size: 13px;
}

.dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    margin-right: 5px;
}

.footer {
    text-align: center;
    color: #9ca3af;
    margin-top: 35px;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<h1>IPv4 Subnetting</h1>
<p class="subtitle">
Interactive visualization of network division
</p>

<div class="controls">
    <label for="prefix">
        Select CIDR Prefix:
    </label>

    <select id="prefix">
        <option value="24">/24</option>
        <option value="25" selected>/25</option>
        <option value="26">/26</option>
        <option value="27">/27</option>
        <option value="28">/28</option>
        <option value="29">/29</option>
        <option value="30">/30</option>
    </select>
</div>

<div class="bit-section">
    <h3>Network and Host Bits</h3>

    <p>
        Original Network:
        <strong>192.168.100.0/24</strong>
    </p>

    <div class="bits" id="bitDisplay"></div>

    <div class="legend">
        <span>
            <i class="dot" style="background:#2563eb"></i>
            Network Bits
        </span>

        <span>
            <i class="dot" style="background:#16a34a"></i>
            Host Bits
        </span>
    </div>

    <p id="bitInfo"></p>
</div>

<div class="visual" id="subnetContainer"></div>

<div class="details" id="details"></div>

<div class="footer">
    IPv4 Subnetting | FLSM Visualization
</div>

</div>

<script>

const originalPrefix = 24;

const prefixSelect = document.getElementById("prefix");

function ipToString(number) {
    return `192.168.100.${number}`;
}

function getSubnetMask(prefix) {

    const mask = [];

    for (let i = 0; i < 4; i++) {
        const remaining = prefix - (i * 8);

        if (remaining >= 8) {
            mask.push(255);
        } else if (remaining <= 0) {
            mask.push(0);
        } else {
            mask.push(256 - Math.pow(2, 8 - remaining));
        }
    }

    return mask.join(".");
}

function updateVisualization() {

    const prefix = Number(prefixSelect.value);

    const borrowedBits = prefix - originalPrefix;
    const hostBits = 32 - prefix;

    const numberOfSubnets = Math.pow(2, borrowedBits);
    const totalAddresses = Math.pow(2, hostBits);

    const usableHosts =
        prefix === 31 ? 2 :
        prefix === 32 ? 1 :
        totalAddresses - 2;

    const subnetMask = getSubnetMask(prefix);

    // Display network and host bits

    const bitDisplay = document.getElementById("bitDisplay");

    bitDisplay.innerHTML = "";

    for (let i = 0; i < 32; i++) {

        const bit = document.createElement("div");

        bit.className =
            i < prefix ? "bit network-bit" : "bit host-bit";

        bit.textContent = i < prefix ? "1" : "0";

        bitDisplay.appendChild(bit);
    }

    document.getElementById("bitInfo").innerHTML = `
        Network Bits: <strong>${prefix}</strong> |
        Host Bits: <strong>${hostBits}</strong> |
        Borrowed Bits: <strong>${borrowedBits}</strong>
    `;

    // Generate subnet cards

    const subnetContainer =
        document.getElementById("subnetContainer");

    subnetContainer.innerHTML = "";

    for (let i = 0; i < numberOfSubnets; i++) {

        const start = i * totalAddresses;
        const end = start + totalAddresses - 1;

        const network = start;
        const broadcast = end;

        let firstHost;
        let lastHost;

        if (prefix === 32) {
            firstHost = network;
            lastHost = network;
        } else if (prefix === 31) {
            firstHost = network;
            lastHost = broadcast;
        } else {
            firstHost = network + 1;
            lastHost = broadcast - 1;
        }

        const card = document.createElement("div");

        card.className =
            `subnet ${i % 2 === 0 ? "subnet-0" : "subnet-1"}`;

        card.innerHTML = `
            <h2>Subnet S${i}</h2>

            <span class="badge">/${prefix}</span>
            <span class="badge">${usableHosts} Usable Hosts</span>

            <p class="network-id">
                Network ID: ${ipToString(network)}
            </p>

            <div class="address">
                <strong>Address Block</strong><br>
                ${ipToString(start)}<br>
                to<br>
                ${ipToString(end)}
            </div>

            <div class="address">
                <strong>Usable Host Range</strong><br>
                ${ipToString(firstHost)}<br>
                to<br>
                ${ipToString(lastHost)}
            </div>

            <p>
                <strong>Broadcast:</strong><br>
                ${ipToString(broadcast)}
            </p>

            <p>
                <strong>Subnet Mask:</strong><br>
                ${subnetMask}
            </p>
        `;

        subnetContainer.appendChild(card);
    }

    // Summary cards

    document.getElementById("details").innerHTML = `

        <div class="detail-card">
            <h3>Original Network</h3>
            <p>192.168.100.0/24</p>
        </div>

        <div class="detail-card">
            <h3>New Subnet Mask</h3>
            <p>${subnetMask}</p>
        </div>

        <div class="detail-card">
            <h3>Number of Subnets</h3>
            <p>${numberOfSubnets}</p>
        </div>

        <div class="detail-card">
            <h3>Borrowed Bits</h3>
            <p>${borrowedBits}</p>
        </div>

        <div class="detail-card">
            <h3>Host Bits</h3>
            <p>${hostBits}</p>
        </div>

        <div class="detail-card">
            <h3>Usable Hosts / Subnet</h3>
            <p>${usableHosts}</p>
        </div>
    `;
}

prefixSelect.addEventListener(
    "change",
    updateVisualization
);

updateVisualization();

</script>

</body>
</html>
